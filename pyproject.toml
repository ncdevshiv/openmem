[project]
name = "openmem"
version = "2.0.0"
description = "Agent-agnostic autonomous memory system for AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "lancedb>=0.12.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "python-dateutil>=2.8.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
llm = [
    "litellm>=1.0.0",
]
honcho = [
    "honcho-ai>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools]
packages = [
    "memory_store",
    "learning_loop",
    "autonomous",
    "agents",
    "agents.generic",
    "agents.qwen_code",
    "agents.claude_code",
    "agents.codex_cli",
    "agents.opencode",
    "agents.antigravity_ide",
    "agents.kilo_cli",
    "agents.vscode",
    "agents.windsurf",
    "agents.cursor",
    "agents.openclaw",
    "core",
    "bin",
    "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
